<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolTechLabs</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html{scroll-behavior:smooth;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
}

/* HEADER */
.header{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:64px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 32px;
    z-index:1000;
    border-bottom:2px solid #000;
}
.brand{
    font-size:22px;
    font-weight:700;
    color:#000;
}

/* NAV */
.nav{display:flex;gap:28px;}
.nav a{
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    color:rgba(0,0,0,.6);
    transition:.3s;
}
.nav a.active,
.nav a:hover{
    color:#000;
}

/* OFFSET */
section{scroll-margin-top:80px;}
.spacer{height:64px;}

/* HERO */
.hero{
    min-height:calc(100vh - 64px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
}
.wrapper{max-width:860px;}
h1{
    font-size:clamp(32px,8vw,64px);
    font-weight:900;
    margin-bottom:12px;
}
p{
    font-size:22px;
    line-height:1.2;
    opacity:.8;
}

/* DIVIDER */
.section-divider{
    width:100%;
    height:1px;
    background:rgba(255,255,255,.3);
}

/* CONTACT */
#contact{
    padding:100px 20px;
    text-align:center;
}
#contact h2{
    font-size:40px;
    margin-bottom:48px;
}

/* CONTACT ITEM */
.contact-item{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:16px auto;
    padding:16px 28px;
    max-width:420px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    font-weight:600;
    transition:.3s;
}
.contact-item:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.12);
}
.contact-item svg{
    width:22px;
    height:22px;
    fill:#fff;
}
.contact-item a{
    color:#fff;
    text-decoration:none;
}

/* MOBILE */
@media(max-width:600px){
    .header{padding:0 18px;}
    .brand{font-size:18px;}
    .nav{gap:18px;}
    p{font-size:18px;}
}
</style>
</head>

<body>

<header class="header">
    <div class="brand">SolTechLabs</div>
    <nav class="nav">
        <a href="#home" class="active">Home</a>
        <a href="#contact">Contact Us</a>
    </nav>
</header>

<div class="spacer"></div>

<section id="home" class="hero">
    <div class="wrapper">
        <h1>SolTechLabs</h1>
        <p>A Tech Solution Research Initiative.</p>
    </div>
</section>

<div class="section-divider"></div>

<section id="contact">
    <h2>Contact Us</h2>

    <div class="contact-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <a href="mailto:Info@Soltechlabs.com">Info@Soltechlabs.com</a>
    </div>
</section>

<script>
const navLinks = document.querySelectorAll(".nav a");
const sections = document.querySelectorAll("section");

/* CLICK → INSTANT FEEDBACK */
navLinks.forEach(link=>{
    link.addEventListener("click",()=>{
        navLinks.forEach(l=>l.classList.remove("active"));
        link.classList.add("active");
    });
});

/* SCROLL → AUTO HIGHLIGHT (FIXED) */
const observer = new IntersectionObserver(
    entries=>{
        entries.forEach(entry=>{
            if(entry.isIntersecting){
                navLinks.forEach(l=>l.classList.remove("active"));
                const active=document.querySelector(
                    `.nav a[href="#${entry.target.id}"]`
                );
                if(active) active.classList.add("active");
            }
        });
    },
    { threshold: 0.6 }
);

sections.forEach(section=>observer.observe(section));
</script>

</body>
</html>
